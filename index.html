<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carta de vinos naturales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* tokens from the Figma file */
  --bg:#ffffff;
  --bg-subtle:#f4f3f0;
  --bg-accent:#2f6b4f;
  --border:#e8e6e1;
  --border-strong:#d6d3cc;
  --grabber:rgba(55,53,47,.35);
  --text:#1a1917;
  --text-muted:#45423d;
  --text-subtle:#75716a;
  --on-accent:#ffffff;
  --warning:#b7791f;
  --radius-sm:8px;
  --radius-md:16px;
  --radius-xl:32px;
  --radius-full:999px;
  --fs-md:15px; --lh-md:24px;
  --fs-sm:14px; --lh-sm:20px;
  --fs-xs:12px; --lh-xs:16px;
  --dock-h:120px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Spline Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-md);line-height:var(--lh-md);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}

/* masked icons: one svg, any colour */
.ic{
  display:block;flex:0 0 auto;width:24px;height:24px;background-color:currentColor;
  -webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat;
}
.ic-20{width:20px;height:20px;}
.i-search{--icon:url(assets/icons/search.svg);}
.i-x{--icon:url(assets/icons/circle-x.svg);}
.i-plus{--icon:url(assets/icons/plus.svg);}
.i-check{--icon:url(assets/icons/check.svg);}
.i-chev{--icon:url(assets/icons/chevron-down.svg);}
.i-grape{--icon:url(assets/icons/grape.svg);}
.i-pin{--icon:url(assets/icons/map-pin.svg);}
.i-scale{--icon:url(assets/icons/scale.svg);}
.i-dollar{--icon:url(assets/icons/dollar-sign.svg);}

.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;}

/* LIST */
main{padding:max(16px,env(safe-area-inset-top)) 16px calc(var(--dock-h) + 16px);}
.row{position:relative;}
.row:not(:last-child)::after{
  content:"";position:absolute;left:16px;right:0;bottom:0;height:1px;background:var(--border);
}
.row-head{display:flex;align-items:center;gap:12px;padding:12px 0 12px 16px;cursor:pointer;}
.row-main{flex:1 1 0;min-width:0;}
.row-title{display:flex;gap:4px;align-items:baseline;white-space:nowrap;overflow:hidden;}
.row-name{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;}
.row-vintage{color:var(--text-muted);flex:0 0 auto;}
.row-meta{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-extra{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-extra.profile{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text-subtle);}
.row-dot{position:absolute;left:-4px;top:20px;width:8px;height:8px;}
.row-dot img{display:block;width:8px;height:8px;}
.row-trail{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;}
.row-price{font-weight:500;white-space:nowrap;}
.row-stock{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--warning);height:20px;display:flex;align-items:center;white-space:nowrap;}
.add-btn{
  flex:0 0 auto;width:36px;height:36px;border-radius:var(--radius-full);
  border:1px solid var(--border-strong);background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;padding:0;
}
.add-btn .ic{width:20px;height:20px;}
.add-btn.added{background:var(--bg-accent);border-color:var(--bg-accent);color:var(--on-accent);}
.row-expand{max-height:0;overflow:hidden;transition:max-height .22s ease;padding:0 0 0 16px;}
.row.open .row-expand{max-height:620px;}
.expand-inner{border-top:1px solid var(--border);padding:12px 0 12px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);}
.expand-row{margin-bottom:10px;}
.expand-label{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text-subtle);font-weight:500;margin-bottom:2px;}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.tastetag,.grapetag{
  font-size:var(--fs-xs);line-height:var(--lh-xs);padding:4px 10px;border-radius:var(--radius-md);
  background:var(--bg-subtle);color:var(--text-muted);
}
.tastetag.empty,.grapetag.unconfirmed{background:transparent;border:1px dashed var(--border-strong);color:var(--text-subtle);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state p{margin:4px 0;}
.empty-state p strong{color:var(--text);font-weight:500;}
.btn{
  flex:1;padding:12px 16px;border-radius:var(--radius-full);border:1px solid transparent;font-weight:500;
}
.btn-ghost{background:var(--bg);color:var(--text);border-color:var(--border-strong);}
.btn-primary{background:var(--bg-accent);color:var(--on-accent);}
.empty-state .btn{flex:none;margin-top:14px;}

/* DOCK (filters + shortlist bar) */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;
  display:flex;flex-direction:column;
}
.sheet{
  position:relative;background:var(--bg-subtle);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow:0 -8px 40px rgba(26,25,23,.08);
  padding-bottom:max(env(safe-area-inset-bottom),14px);
  display:flex;flex-direction:column;
}
.sheet.stacked{padding-bottom:calc(max(env(safe-area-inset-bottom),14px) + 24px);}
.grabber{
  position:absolute;top:0;left:0;right:0;height:24px;border:0;background:none;padding:0;z-index:2;
}
.grabber::after{
  content:"";position:absolute;left:50%;top:11px;width:36px;height:5px;margin-left:-18px;
  border-radius:var(--radius-full);background:var(--grabber);
}
.sheet-head{padding:16px 16px 0;}
.filter-by{padding:0 8px;color:var(--text-subtle);}
.head-row{display:flex;align-items:center;gap:12px;padding:12px 8px;min-height:48px;}
.head-label{flex:1 1 0;min-width:0;font-weight:500;}
.head-label.muted{font-weight:400;color:var(--text-subtle);}
.head-btn{background:none;border:0;padding:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-subtle);}
.head-btn .ic{width:20px;height:20px;}
.head-search{flex:1 1 0;min-width:0;border:0;background:transparent;outline:0;font-weight:500;color:var(--text);padding:0;}
.head-search::placeholder{color:var(--text-subtle);font-weight:400;}
.count-chip{background:rgba(255,255,255,.2);border-radius:var(--radius-sm);padding:0 8px;font-weight:500;}

/* shortlist bar */
.sheet.green{background:var(--bg-accent);color:var(--on-accent);margin-top:-24px;z-index:1;box-shadow:none;}
.sheet.green .head-row{padding:12px 8px;}
.sheet.green .head-btn{color:var(--on-accent);}
.sheet.green .head-label{font-weight:400;}
.sheet.green .grabber::after{background:rgba(255,255,255,.45);}
.sheet.green .head-row{cursor:pointer;}

/* segmented control (wine type) */
.seg{
  display:flex;margin:12px 0 0;border:1px solid var(--border);border-radius:var(--radius-md);
}
.seg-item{
  flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:var(--radius-md);
  padding:8px 0;display:flex;align-items:center;justify-content:center;
}
.seg-item.on{background:var(--bg);}
.seg-ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.seg-ico img,.seg-ico .dotcss{display:block;width:20px;height:20px;}
.dotcss{border-radius:50%;}

.sheet-content{padding:16px;overflow-y:auto;max-height:46vh;}
.sheet.expanded .sheet-content{max-height:none;}
.sheet.expanded{height:88vh;height:88dvh;}
.sheet.expanded .sheet-content{flex:1 1 auto;min-height:0;padding-bottom:56px;}
.chips{display:flex;flex-wrap:wrap;gap:12px 8px;}
.chip{
  border:0;background:var(--bg);color:var(--text-muted);border-radius:var(--radius-md);
  padding:8px 16px;white-space:nowrap;max-width:100%;
}
.chip.on{background:var(--bg-accent);color:var(--on-accent);}
.chip.wide{flex:1 1 0;text-align:center;}
.chip.more{background:var(--bg-subtle);border:1px solid var(--border);color:var(--text);font-weight:500;}
.chips-body-row{display:flex;gap:8px;margin-bottom:12px;}
.none-found{color:var(--text-subtle);padding:8px;}
.show-less{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + max(env(safe-area-inset-bottom),14px) + 16px);
  background:var(--bg-accent);color:var(--on-accent);border:0;border-radius:var(--radius-full);
  padding:8px 20px;font-weight:500;box-shadow:0 6px 20px rgba(26,25,23,.2);z-index:3;
}
.fade-bottom{
  position:absolute;left:0;right:0;bottom:calc(64px + max(env(safe-area-inset-bottom),14px) + 8px);height:72px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(244,243,240,0),var(--bg-subtle));z-index:2;
}

/* price */
.price-row{display:flex;align-items:center;gap:8px;}
.price-sep{color:var(--text-muted);}
.price-input{
  flex:1 1 0;min-width:0;border:0;outline:0;background:var(--bg);border-radius:var(--radius-md);
  padding:12px 16px;color:var(--text);
}
.price-input::placeholder{color:var(--text-subtle);}
.price-input:focus{box-shadow:0 0 0 1.5px var(--bg-accent);}
.price-hint{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text-subtle);padding:8px 16px 0;}

/* filter tabs */
.tabs{display:flex;gap:8px;padding:0 16px;}
.tab{
  position:relative;flex:1 1 0;min-width:0;height:64px;border:0;border-radius:var(--radius-md);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-subtle);font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;
}
.tab.sel{background:var(--bg);color:var(--text);}
.tab .ico{position:relative;}
.tab.active .ico::after{
  content:"";position:absolute;top:-3px;right:-4px;width:10px;height:10px;border-radius:50%;
  background:var(--bg-accent);border:2px solid var(--bg-subtle);box-sizing:content-box;margin:-2px -2px 0 0;
}
.tab.sel.active .ico::after{border-color:var(--bg);}

/* shortlist drawer */
.drawer{position:fixed;inset:0;background:rgba(26,25,23,.4);z-index:50;display:none;}
.drawer.open{display:block;}
.drawer-sheet{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;top:8vh;
  background:var(--bg);border-radius:var(--radius-xl) var(--radius-xl) 0 0;display:flex;flex-direction:column;
  animation:slideup .18s ease-out;
}
@keyframes slideup{from{transform:translate(-50%,20px);opacity:.4;}to{transform:translate(-50%,0);opacity:1;}}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 12px;flex:0 0 auto;}
.drawer-header h2{font-size:17px;margin:0;font-weight:500;}
.drawer-header button{background:none;border:0;color:var(--text-subtle);font-weight:500;padding:6px;}
.drawer-body{flex:1;overflow-y:auto;padding:0 16px;}
.slrow .row-head{align-items:flex-start;}
.slrow-remove{background:none;border:0;padding:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-subtle);}
.slrow-remove .ic{width:20px;height:20px;}
.drawer-footer{flex:0 0 auto;padding:12px 16px max(env(safe-area-inset-bottom),14px);display:flex;gap:8px;}
.sl-empty{padding:50px 20px;text-align:center;color:var(--text-muted);}

.toast{
  position:fixed;left:50%;bottom:calc(var(--dock-h) + 16px);transform:translateX(-50%);
  background:var(--text);color:#fff;padding:8px 16px;border-radius:var(--radius-full);
  font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;z-index:60;opacity:0;
  transition:opacity .2s ease;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;}

/* TABLET + DESKTOP: side panel with every filter visible */
.wide-title,.panel{display:none;}
@media (min-width:768px){
  .app{max-width:none;display:grid;grid-template-columns:minmax(300px,360px) 1fr;align-items:start;}
  .panel:not([hidden]){
    display:block;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
    background:var(--bg-subtle);padding:24px 16px 32px;border-radius:0 var(--radius-xl) var(--radius-xl) 0;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 16px;}
  .panel-head h2{margin:0;font-size:17px;font-weight:500;}
  .panel-clear{background:none;border:0;padding:0;color:var(--text-muted);font-weight:500;display:flex;align-items:center;gap:8px;}
  .count-chip.dark{background:var(--text);color:#fff;}
  .panel-sec{border-top:1px solid var(--border);}
  .panel-sec:last-child{border-bottom:1px solid var(--border);}
  .acc-head{
    width:100%;display:flex;align-items:center;gap:8px;padding:14px 8px;background:none;border:0;
    text-align:left;color:var(--text);
  }
  .acc-title{font-weight:500;}
  .acc-sum{margin-left:auto;color:var(--text-subtle);font-size:var(--fs-sm);line-height:var(--lh-sm);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acc-chev{color:var(--text-subtle);transition:transform .18s ease;}
  .acc-head .acc-title + .acc-chev{margin-left:auto;}
  .panel-sec.open .acc-chev{transform:rotate(180deg);}
  .acc-body{padding:0 0 20px;}
  .panel-sec .seg{margin:0;}
  .panel-search{display:flex;align-items:center;gap:12px;padding:8px 16px;margin-bottom:12px;background:var(--bg);border-radius:var(--radius-md);color:var(--text-subtle);}
  .panel-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:0;}
  .panel-search input::placeholder{color:var(--text-subtle);}
  .panel .none-found{padding:8px;}
  main{padding:32px 32px 112px;}
  .wide-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 16px;padding:0 16px;}
  .wide-title h1{margin:0;font-size:22px;line-height:28px;font-weight:500;}
  .wide-title span{color:var(--text-subtle);font-size:var(--fs-sm);}
  .card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));column-gap:24px;align-content:start;}
  .row-head{padding-right:0;}
  .dock.wide{left:auto;right:24px;bottom:24px;transform:none;max-width:420px;width:calc(100% - 48px);}
  .dock.wide .sheet.green{margin:0;border-radius:var(--radius-xl);padding-bottom:4px;box-shadow:0 12px 32px rgba(26,25,23,.2);}
  .dock.wide .sheet.green .grabber{display:none;}
  .dock.wide .sheet.green .sheet-head{padding-top:4px !important;}
  .toast{left:calc(360px + (100vw - 360px)/2);bottom:96px;}
  .drawer-sheet{top:6vh;border-radius:var(--radius-xl);bottom:6vh;max-width:560px;}
}
@media (min-width:1280px){
  .app{grid-template-columns:380px 1fr;}
  .card-list{grid-template-columns:repeat(auto-fill,minmax(440px,1fr));}
}
@media (hover:hover){
  .chip:not(.on):hover{background:#fbfbfa;}
  .add-btn:not(.added):hover{background:var(--bg-subtle);}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" hidden></aside>
  <main><div class="wide-title"><h1>Carta de vinos naturales</h1><span id="resultCount"></span></div><div id="listWrap"></div></main>
  <div class="dock" id="dock"></div>
</div>

<!-- SHORTLIST DRAWER -->
<div class="drawer" id="shortlistDrawer">
  <div class="drawer-sheet">
    <div class="drawer-header">
      <h2>Shortlist</h2>
      <button id="closeDrawer">Cerrar</button>
    </div>
    <div class="drawer-body" id="shortlistBody"></div>
    <div class="drawer-footer">
      <button class="btn btn-ghost" id="clearShortlist">Vaciar</button>
      <button class="btn btn-primary" id="copyShortlist">Copiar lista</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let WINES = [];

// UI copy, as written in the Figma file. Change here to localise.
const T = {
  tabs: {grape:"Tipo", region:"Región", profile:"Notas", price:"Precio"},
  headers: {grape:"Tipo de uva", region:"Región", profile:"Notas", price:"Precio"},
  filterBy: "Filtrar por",
  showAll: "Ver todo",
  showLess: "Ver menos",
  min: "Min",
  max: "Max",
  priceHint: (lo,hi)=>`Rango en carta: ${lo}–${hi} €`,
  noFilters: "Filtros",
  clearAll: "Quitar",
  typeTitle: "Tipo de vino",
  filtersActive: n => n===1 ? "filtro activo" : "filtros activos",
  inShortlist: n => n===1 ? "vino en la shortlist" : "vinos en la shortlist",
  noMatches: "Sin coincidencias",
};

const TABS = ["grape","region","profile","price"];
const TAB_ICON = {grape:"i-grape", region:"i-pin", profile:"i-scale", price:"i-dollar"};
const SEARCHABLE = {grape:true, region:true};
const COMMON_COUNT = 17;

// Profile tab: body first (own row), then the rest in the order of the design.
const BODY_TAGS = ["Con cuerpo","Cuerpo medio","Ligero"];
const OTHER_TAGS = ["Fresco","Vibrante","Eléctrico","Acídico","Afrutado","Tropical","Especiado","Mineral","Volátil"];

// Wine-type dots: the five from Figma are SVG assets; the two extra categories
// in the sheet (not in the design) fall back to a CSS circle.
const CATEGORY_ORDER = ["Blanco","Tinto","Rosado","Orange","Burbujas","Dulce","Sin alcohol"];
const CATEGORY_DOT = {
  "Blanco":"assets/dots/white.svg",
  "Tinto":"assets/dots/red.svg",
  "Rosado":"assets/dots/rose.svg",
  "Orange":"assets/dots/orange.svg",
  "Burbujas":"assets/dots/sparkling.svg",
};
const CATEGORY_FALLBACK_COLOR = {"Dulce":"#C08A2E","Sin alcohol":"#9CA3AF"};
function dotImg(cat, size){
  const src = CATEGORY_DOT[cat];
  if(src) return `<img src="${src}" alt="" width="${size}" height="${size}">`;
  return `<span class="dotcss" style="width:${size}px;height:${size}px;background:${CATEGORY_FALLBACK_COLOR[cat]||"#8f8d87"}"></span>`;
}

const COUNTRY_FLAGS = {
  "España":"🇪🇸","Francia":"🇫🇷","Italia":"🇮🇹","Portugal":"🇵🇹","Alemania":"🇩🇪","Austria":"🇦🇹",
  "Argentina":"🇦🇷","Chile":"🇨🇱","Croacia":"🇭🇷","Georgia":"🇬🇪","Grecia":"🇬🇷","Hungaria":"🇭🇺",
  "República Checa":"🇨🇿","Slovakia":"🇸🇰",
};
function flagFor(pais){ return COUNTRY_FLAGS[pais] || ""; }

// ---------- state ----------
const state = {
  query: "",
  category: "Todos",
  taste: new Set(),
  regions: new Set(),
  grapes: new Set(),
  priceMin: null,
  priceMax: null,
  hideUnavailable: true,
  shortlist: new Set(),
  openRow: null,
  openSlRow: null,
};
const ui = { open:false, tab:"grape", expanded:false, searching:false, searchText:"", acc:{type:false,grape:false,region:false,profile:false,price:false}, exp:{grape:false,region:false}, wq:{grape:"",region:""} };
const wideMq = window.matchMedia("(min-width:768px)");
const isWide = () => wideMq.matches;

// ---------- helpers ----------
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function normalize(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function levenshtein(a,b){
  if(a===b) return 0;
  const al=a.length, bl=b.length;
  if(al===0) return bl;
  if(bl===0) return al;
  let prev = new Array(bl+1);
  for(let j=0;j<=bl;j++) prev[j]=j;
  for(let i=1;i<=al;i++){
    let cur=[i];
    for(let j=1;j<=bl;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev=cur;
  }
  return prev[bl];
}
function tokenFuzzyMatch(token, word){
  if(!word || word.length<2) return false;
  if(word.startsWith(token) || word.indexOf(token)!==-1) return true;
  if(token.length>=4 && word.length>=4 && word.indexOf(token)===-1 && token.indexOf(word)!==-1) return true;
  if(token.length<=2) return false;
  const maxDist = token.length<=4?1:(token.length<=8?2:3);
  return levenshtein(token,word)<=maxDist;
}
function wineHaystackWords(w){
  if(!w._words){
    const hay = normalize(w.nombre+" "+w.productora);
    w._words = hay.split(/[^a-z0-9à-ú]+/i).filter(Boolean);
    w._hay = hay;
  }
  return w;
}
function matchesQuery(w, query){
  if(!query) return true;
  wineHaystackWords(w);
  const qTokens = normalize(query).split(/\s+/).filter(Boolean);
  return qTokens.every(qt => w._hay.includes(qt) || w._words.some(word => tokenFuzzyMatch(qt, word)));
}
function fmtPrice(p){ return p==null ? "—" : p.toFixed(2).replace(".",","); }
function isSellable(w){
  const s = w.stock;
  if(s.kind==="no_vender") return false;
  if(s.kind==="number" && s.value<=0) return false;
  return true;
}
// Stock is only called out when 1–2 bottles are left.
function lowStockLabel(w){
  const s = w.stock;
  return (s.kind==="number" && s.value>0 && s.value<=2) ? `${s.value} left` : "";
}

// ---------- derived data ----------
let allRegions = [], regionCounts = {}, grapeCounts = {}, allGrapesSorted = [];
let commonGrapes = [], commonRegions = [];
let priceFloor = 0, priceCeil = 0;
const byName = (a,b)=>a.localeCompare(b,"es");
function computeDerived(){
  regionCounts = {};
  WINES.forEach(w => { if(w.regionNorm) regionCounts[w.regionNorm]=(regionCounts[w.regionNorm]||0)+1; });
  allRegions = Object.keys(regionCounts).sort(byName);
  commonRegions = Object.keys(regionCounts).sort((a,b)=>regionCounts[b]-regionCounts[a]).slice(0,COMMON_COUNT).sort(byName);

  grapeCounts = {};
  WINES.forEach(w => w.uvasTags.forEach(g => grapeCounts[g]=(grapeCounts[g]||0)+1));
  allGrapesSorted = Object.keys(grapeCounts).sort(byName);
  commonGrapes = Object.keys(grapeCounts).sort((a,b)=>grapeCounts[b]-grapeCounts[a]).slice(0,COMMON_COUNT).sort(byName);

  const prices = WINES.map(w=>w.precio).filter(p=>p!=null);
  priceFloor = prices.length ? Math.floor(Math.min(...prices)) : 0;
  priceCeil = prices.length ? Math.ceil(Math.max(...prices)) : 0;
}

// Grape chips follow the wine-type segment: only grapes used by wines of the
// selected type are offered (all grapes when no type is selected).
function grapesForCategory(){
  const counts = {};
  WINES.forEach(w=>{
    if(state.category!=="Todos" && w.categoria!==state.category) return;
    if(state.hideUnavailable && !isSellable(w)) return;
    w.uvasTags.forEach(g=>counts[g]=(counts[g]||0)+1);
  });
  const all = Object.keys(counts).sort(byName);
  const common = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,COMMON_COUNT).sort(byName);
  return {all, common};
}
function pruneGrapesToCategory(){
  const valid = new Set(grapesForCategory().all);
  [...state.grapes].forEach(g=>{ if(!valid.has(g)) state.grapes.delete(g); });
}

// ---------- filtering ----------
function getFiltered(){
  return WINES.filter(w=>{
    if(state.hideUnavailable && !isSellable(w)) return false;
    if(state.category!=="Todos" && w.categoria!==state.category) return false;
    if(!matchesQuery(w, state.query)) return false;
    if(state.taste.size && !w.etiquetasCata.some(t=>state.taste.has(t))) return false;
    if(state.regions.size && !state.regions.has(w.regionNorm)) return false;
    if(state.grapes.size && !w.uvasTags.some(g=>state.grapes.has(g))) return false;
    if(state.priceMin!=null && (w.precio==null || w.precio<state.priceMin)) return false;
    if(state.priceMax!=null && (w.precio==null || w.precio>state.priceMax)) return false;
    return true;
  });
}
function activeFilterCount(){
  let n = state.taste.size + state.regions.size + state.grapes.size;
  if(state.priceMin!=null || state.priceMax!=null) n += 1;
  if(state.category!=="Todos") n += 1;
  return n;
}
function tabActive(tab){
  if(tab==="grape") return state.grapes.size>0;
  if(tab==="region") return state.regions.size>0;
  if(tab==="profile") return state.taste.size>0;
  return state.priceMin!=null || state.priceMax!=null;
}

// ---------- render: wine list ----------
function tasteTagsHtml(w){
  if(!w.etiquetasCata.length) return `<span class="tastetag empty">Sin etiqueta de cata todavía</span>`;
  return w.etiquetasCata.map(t=>`<span class="tastetag">${esc(t)}</span>`).join("");
}
function grapeTagsHtml(w){
  if(w.uvasRevisar || !w.uvasTags.length) return `<span class="grapetag unconfirmed">Uva sin confirmar</span>`;
  return w.uvasTags.slice(0,6).map(g=>`<span class="grapetag">${esc(g)}</span>`).join("");
}
function fichaBodyHtml(w){
  const flag = flagFor(w.pais);
  return `
    <div class="expand-row"><div class="expand-label">País / Año</div>${flag?flag+" ":""}${esc(w.pais||"—")} · ${esc(w.anio||"—")} · ${esc(w.tamano||"75cl")}</div>
    <div class="expand-row"><div class="expand-label">Etiquetas de cata</div><div class="tagline">${tasteTagsHtml(w)}</div></div>
    <div class="expand-row"><div class="expand-label">Uva</div><div class="tagline">${grapeTagsHtml(w)}</div><div style="margin-top:6px;">${esc(w.uva || "No especificada en la ficha original.")}</div></div>
    <div class="expand-row"><div class="expand-label">Notas del sumiller</div>${esc(w.notas || (w.notasSinDatos ? "Esta ficha aún no tiene notas de cata registradas." : "—"))}</div>
    <div class="expand-row"><div class="expand-label">Coste / Precio</div>Coste ${w.coste!=null?fmtPrice(w.coste)+" €":"—"} · PVP ${fmtPrice(w.precio)} €</div>`;
}
function vintageLabel(w){
  const size = (w.tamano||"").trim();
  const bigBottle = size && !/^75\s*cl$/i.test(size);
  return [w.anio, bigBottle?size:""].filter(Boolean).join(" · ");
}
function rowHtml(w){
  const inList = state.shortlist.has(w.id);
  const open = state.openRow===w.id;
  const stock = lowStockLabel(w);
  const grapeLine = state.grapes.size && w.uvasTags.length ? `<div class="row-extra">${esc(w.uvasTags.join(", "))}</div>` : "";
  const profileLine = state.taste.size && w.etiquetasCata.length ? `<div class="row-extra profile">${esc(w.etiquetasCata.join(" · "))}</div>` : "";
  const place = w.regionNorm || w.pais;
  return `
  <div class="row ${open?"open":""}" data-id="${w.id}">
    <div class="row-head" data-toggle="${w.id}">
      <div class="row-main">
        <div class="row-title"><span class="row-name">${esc(w.nombre)}</span><span class="row-vintage">${esc(vintageLabel(w))}</span></div>
        <div class="row-meta">${esc(w.productora||"Productor sin especificar")}${place?` · ${esc(place)}`:""}</div>
        ${grapeLine}${profileLine}
      </div>
      <span class="row-dot" title="${esc(w.categoria)}">${dotImg(w.categoria,8)}</span>
      <div class="row-trail">
        <div class="row-price">${fmtPrice(w.precio)} €</div>
        ${stock?`<div class="row-stock">${stock}</div>`:""}
      </div>
      <button class="add-btn ${inList?"added":""}" data-shortlist="${w.id}" aria-label="${inList?"Quitar de la shortlist":"Añadir a la shortlist"}"><span class="ic ${inList?"i-check":"i-plus"}"></span></button>
    </div>
    <div class="row-expand"><div class="expand-inner">${fichaBodyHtml(w)}</div></div>
  </div>`;
}

let renderLimit = 60;
function renderList(){
  const filtered = getFiltered();
  const wrap = document.getElementById("listWrap");
  document.getElementById("resultCount").textContent = filtered.length + (filtered.length===1?" vino":" vinos");
  if(!filtered.length){
    wrap.innerHTML = `
      <div class="empty-state">
        <p><strong>Ningún vino coincide con estos filtros.</strong></p>
        <p>Prueba a quitar alguno o ampliar la búsqueda.</p>
        <button class="btn btn-primary" id="emptyReset">Limpiar filtros</button>
      </div>`;
    document.getElementById("emptyReset").addEventListener("click", clearAllFilters);
    return;
  }
  const slice = filtered.slice(0, renderLimit);
  let html = `<div class="card-list">` + slice.map(rowHtml).join("") + `</div>`;
  if(filtered.length > renderLimit){
    html += `<div style="text-align:center;padding:14px 0;"><button class="btn btn-ghost" id="loadMoreBtn" style="flex:none;">Cargar más (${filtered.length - renderLimit} restantes)</button></div>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = Number(el.dataset.toggle);
      state.openRow = state.openRow===id ? null : id;
      renderList();
    });
  });
  wrap.querySelectorAll("[data-shortlist]").forEach(el=>{
    el.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      toggleShortlist(Number(el.dataset.shortlist));
    });
  });
  const loadMore = document.getElementById("loadMoreBtn");
  if(loadMore) loadMore.addEventListener("click", ()=>{ renderLimit += 60; renderList(); });
}

// ---------- render: dock ----------
function chipHtml(label, on, attrs, extraCls){
  return `<button class="chip ${on?"on":""} ${extraCls||""}" ${attrs}>${esc(label)}</button>`;
}
function chipsForTab(tab, opts){
  const expanded = opts ? opts.expanded : ui.expanded;
  const query = opts ? opts.query : ui.searchText;
  const inlineLess = !!(opts && opts.inlineLess);
  if(tab==="profile"){
    const body = BODY_TAGS.map(t=>chipHtml(t, state.taste.has(t), `data-tag="${esc(t)}"`, "wide")).join("");
    const rest = OTHER_TAGS.map(t=>chipHtml(t, state.taste.has(t), `data-tag="${esc(t)}"`)).join("");
    return `<div class="chips-body-row">${body}</div><div class="chips">${rest}</div>`;
  }
  const isGrape = tab==="grape";
  const grapes = isGrape ? grapesForCategory() : null;
  const all = isGrape ? grapes.all : allRegions;
  const common = isGrape ? grapes.common : commonRegions;
  const sel = isGrape ? state.grapes : state.regions;
  const attr = isGrape ? "data-grape" : "data-region";
  const q = normalize(query);
  let list;
  if(q) list = all.filter(v=>normalize(v).includes(q));
  else list = expanded ? all : common;
  if(!list.length) return `<div class="none-found">${T.noMatches}</div>`;
  let html = list.map(v=>chipHtml(v, sel.has(v), `${attr}="${esc(v)}"`)).join("");
  if(!q && !expanded) html += `<button class="chip more" data-expand="${tab}">${T.showAll}</button>`;
  if(!q && expanded && inlineLess) html += `<button class="chip more" data-collapse="${tab}">${T.showLess}</button>`;
  return `<div class="chips">${html}</div>`;
}
function priceBody(){
  return `
    <div class="price-row">
      <input type="number" inputmode="decimal" class="price-input" id="priceMin" placeholder="${T.min}" value="${state.priceMin??""}">
      <span class="price-sep">–</span>
      <input type="number" inputmode="decimal" class="price-input" id="priceMax" placeholder="${T.max}" value="${state.priceMax??""}">
    </div>
    <div class="price-hint">${T.priceHint(priceFloor, priceCeil)}</div>`;
}
function segmentedHtml(){
  return `<div class="seg" role="group" aria-label="Tipo de vino">` + CATEGORY_ORDER.map(cat=>{
    const on = state.category===cat;
    return `<button class="seg-item ${on?"on":""}" data-cat="${esc(cat)}" aria-pressed="${on}" aria-label="${esc(cat)}"><span class="seg-ico">${dotImg(cat,20)}</span></button>`;
  }).join("") + `</div>`;
}
function headHtml(){
  const label = T.headers[ui.tab];
  const searchable = SEARCHABLE[ui.tab];
  const searchBtn = searchable ? `<button class="head-btn" id="toggleSearch" aria-label="Buscar"><span class="ic ic-20 i-search"></span></button>` : "";
  const showX = ui.tab==="grape" || ui.tab==="region";
  const body = ui.searching
    ? `<input class="head-search" id="headSearch" type="text" placeholder="${label}" value="${esc(ui.searchText)}" autocomplete="off" autocorrect="off" spellcheck="false">`
    : `<div class="head-label">${label}</div>`;
  const xBtn = (showX || ui.searching) ? `<button class="head-btn" id="headX" aria-label="${ui.searching?"Borrar búsqueda":"Cerrar"}"><span class="ic ic-20 i-x"></span></button>` : "";
  const filterBy = searchable ? `<div class="filter-by">${T.filterBy}</div>` : "";
  return `<div class="sheet-head">${filterBy}<div class="head-row">${searchBtn}${body}${xBtn}</div>${ui.tab==="grape"?segmentedHtml():""}</div>`;
}
function tabsHtml(){
  return `<div class="tabs" role="tablist">` + TABS.map(t=>{
    const sel = ui.open && ui.tab===t;
    return `<button class="tab ${sel?"sel":""} ${tabActive(t)?"active":""}" role="tab" aria-selected="${sel}" data-tab="${t}"><span class="ico"><span class="ic ${TAB_ICON[t]}"></span></span>${T.tabs[t]}</button>`;
  }).join("") + `</div>`;
}
function contentHtml(){
  if(ui.tab==="price") return priceBody();
  return chipsForTab(ui.tab);
}

function shortBarHtml(nSel){
  return `<div class="sheet green">
        <div class="sheet-head" style="padding-top:16px;"><div class="head-row" id="shortBar">
          <div class="count-chip">${nSel}</div><div class="head-label">${T.inShortlist(nSel)}</div>
          <button class="head-btn" id="clearShortBar" aria-label="Vaciar shortlist"><span class="ic ic-20 i-x"></span></button>
        </div></div>
      </div>`;
}
// Tablet / desktop: filters live in a side panel, all sections visible at once.
// Collapsible section: header always visible with a one-line summary of what is selected.
function accSummary(set){
  const a=[...set];
  return a.length ? a[0] + (a.length>1 ? ` +${a.length-1}` : "") : "";
}
function panelSummary(key){
  if(key==="type") return state.category!=="Todos" ? state.category : "";
  if(key==="grape") return accSummary(state.grapes);
  if(key==="region") return accSummary(state.regions);
  if(key==="profile") return accSummary(state.taste);
  if(state.priceMin!=null || state.priceMax!=null) return `${state.priceMin??""}–${state.priceMax??""} €`;
  return "";
}
function panelSection(key, title, body){
  const open = ui.acc[key];
  const sum = panelSummary(key);
  return `<section class="panel-sec ${open?"open":""}">
    <button class="acc-head" data-acc="${key}" aria-expanded="${open}">
      <span class="acc-title">${title}</span>
      ${sum?`<span class="acc-sum">${esc(sum)}</span>`:""}
      <span class="ic ic-20 i-chev acc-chev"></span>
    </button>
    ${open?`<div class="acc-body">${body}</div>`:""}
  </section>`;
}
function wideSearchHtml(tab){
  return `<label class="panel-search"><span class="ic ic-20 i-search"></span><input type="text" data-wsearch="${tab}" placeholder="${T.headers[tab]}" value="${esc(ui.wq[tab])}" autocomplete="off" spellcheck="false"></label>`;
}
function chipsBlock(tab){
  return `<div data-chips="${tab}">${chipsForTab(tab,{expanded:ui.exp[tab], query:ui.wq[tab], inlineLess:true})}</div>`;
}
function renderPanel(){
  const nFilt = activeFilterCount();
  const panel = document.getElementById("panel");
  const top = panel.scrollTop;
  panel.innerHTML = `
    <div class="panel-head"><h2>${T.noFilters}</h2>${nFilt?`<button class="panel-clear" id="clearFilters">${T.clearAll} <span class="count-chip dark">${nFilt}</span></button>`:""}</div>
    ${panelSection("type", T.typeTitle, segmentedHtml())}
    ${panelSection("grape", T.headers.grape, wideSearchHtml("grape")+chipsBlock("grape"))}
    ${panelSection("region", T.headers.region, wideSearchHtml("region")+chipsBlock("region"))}
    ${panelSection("profile", T.headers.profile, chipsForTab("profile"))}
    ${panelSection("price", T.headers.price, priceBody())}`;
  panel.scrollTop = top;
}

function renderDock(){
  const dock = document.getElementById("dock");
  const nSel = state.shortlist.size;
  const nFilt = activeFilterCount();
  let html = "";
  const wide = isWide();
  dock.classList.toggle("wide", wide);
  document.getElementById("panel").hidden = !wide;
  if(wide){
    renderPanel();
    dock.innerHTML = nSel ? shortBarHtml(nSel) : "";
    bindDock();
    syncDockHeight();
    return;
  }
  if(ui.open){
    const expandedCls = ui.expanded && ui.tab!=="profile" && ui.tab!=="price" ? " expanded" : "";
    html += `<div class="sheet${expandedCls}">
      <button class="grabber" id="grabber" aria-label="Cerrar filtros"></button>
      ${headHtml()}
      <div class="sheet-content" id="sheetContent">${contentHtml()}</div>
      ${expandedCls?`<div class="fade-bottom"></div><button class="show-less" id="showLess">${T.showLess}</button>`:""}
      ${tabsHtml()}
    </div>`;
  } else {
    html += `<div class="sheet ${nSel?"stacked":""}">
      <button class="grabber" id="grabber" aria-label="Abrir filtros"></button>
      <div class="sheet-head"><div class="head-row" id="minBar" style="cursor:pointer;">
        ${nFilt
          ? `<div class="count-chip" style="background:#fff;">${nFilt}</div><div class="head-label muted">${T.filtersActive(nFilt)}</div><button class="head-btn" id="clearFilters" aria-label="Quitar filtros"><span class="ic ic-20 i-x"></span></button>`
          : `<div class="head-label muted">${T.noFilters}</div>`}
      </div></div>
      ${tabsHtml()}
    </div>`;
    if(nSel) html += shortBarHtml(nSel);
  }
  dock.innerHTML = html;
  bindDock();
  syncDockHeight();
}
// The minimized dock has no .tabs row; keep the compact bar reading like the Figma "Minimized" frame.
function syncDockHeight(){
  const dock = document.getElementById("dock");
  const h = dock.offsetHeight;
  document.documentElement.style.setProperty("--dock-h", (ui.open ? Math.min(h, 140) : h) + "px");
}
function bindDock(){
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const el=$(id); if(el) el.addEventListener("click", fn); };

  on("grabber", ()=>{ ui.open ? closeSheet() : openSheet(ui.tab); });
  on("minBar", (e)=>{ if(e.target.closest("#clearFilters")) return; openSheet(ui.tab); });
  on("clearFilters", (e)=>{ e.stopPropagation(); clearAllFilters(); });
  on("shortBar", (e)=>{
    if(e.target.closest("#clearShortBar")) return;
    renderShortlistDrawer();
    $("shortlistDrawer").classList.add("open");
  });
  on("clearShortBar", (e)=>{
    e.stopPropagation();
    state.shortlist.clear();
    updateAfterShortlist();
    showToast("Shortlist vaciada");
  });

  document.querySelectorAll("#dock [data-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const t = el.dataset.tab;
      if(ui.open && ui.tab===t){ closeSheet(); return; }
      openSheet(t);
    });
  });
  document.querySelectorAll("#dock [data-cat], #panel [data-cat]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const c = el.dataset.cat;
      state.category = state.category===c ? "Todos" : c;
      pruneGrapesToCategory();
      renderLimit = 60;
      renderDock(); renderList();
    });
  });

  on("toggleSearch", ()=>{
    ui.searching = !ui.searching;
    if(!ui.searching) ui.searchText = "";
    renderDock();
    const inp = $("headSearch"); if(inp) inp.focus();
  });
  on("headX", ()=>{
    if(ui.searching){ ui.searching=false; ui.searchText=""; renderDock(); }
    else closeSheet();
  });
  const hs = $("headSearch");
  if(hs) hs.addEventListener("input", (e)=>{
    ui.searchText = e.target.value;
    $("sheetContent").innerHTML = contentHtml();
    bindChips();
  });
  on("showLess", ()=>{ ui.expanded=false; renderDock(); });

  const pMin = $("priceMin"), pMax = $("priceMax");
  if(pMin) pMin.addEventListener("input", (e)=>{ state.priceMin = e.target.value===""?null:Number(e.target.value); afterPriceChange(); });
  if(pMax) pMax.addEventListener("input", (e)=>{ state.priceMax = e.target.value===""?null:Number(e.target.value); afterPriceChange(); });

  document.querySelectorAll("[data-acc]").forEach(el=>el.addEventListener("click", ()=>{
    ui.acc[el.dataset.acc] = !ui.acc[el.dataset.acc];
    renderDock();
  }));

  document.querySelectorAll("[data-wsearch]").forEach(inp=>inp.addEventListener("input", (e)=>{
    const tab = inp.dataset.wsearch;
    ui.wq[tab] = e.target.value;
    document.querySelector(`[data-chips="${tab}"]`).innerHTML = chipsForTab(tab,{expanded:ui.exp[tab], query:ui.wq[tab], inlineLess:true});
    bindChips();
  }));

  bindChips();
}
function afterPriceChange(){
  renderLimit = 60;
  renderList();
  // refresh only the tab indicators so the inputs keep focus
  document.querySelectorAll("#dock [data-tab]").forEach(el=>el.classList.toggle("active", tabActive(el.dataset.tab)));
}
function bindChips(){
  const root = document.getElementById("sheetContent") || (isWide() ? document.getElementById("panel") : null);
  if(!root) return;
  const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); };
  root.querySelectorAll("[data-grape]").forEach(el=>el.addEventListener("click", ()=>{ toggle(state.grapes, el.dataset.grape); chipChanged(); }));
  root.querySelectorAll("[data-region]").forEach(el=>el.addEventListener("click", ()=>{ toggle(state.regions, el.dataset.region); chipChanged(); }));
  root.querySelectorAll("[data-tag]").forEach(el=>el.addEventListener("click", ()=>{ toggle(state.taste, el.dataset.tag); chipChanged(); }));
  root.querySelectorAll("[data-expand]").forEach(el=>el.addEventListener("click", ()=>{
    if(isWide()) ui.exp[el.dataset.expand]=true; else ui.expanded=true;
    renderDock();
  }));
  root.querySelectorAll("[data-collapse]").forEach(el=>el.addEventListener("click", ()=>{ ui.exp[el.dataset.collapse]=false; renderDock(); }));
}
function chipChanged(){
  renderLimit = 60;
  const scroller = document.getElementById("sheetContent");
  const top = scroller ? scroller.scrollTop : 0;
  renderDock();
  const s2 = document.getElementById("sheetContent");
  if(s2) s2.scrollTop = top;
  renderList();
}
function openSheet(tab){
  if(tab!==ui.tab){ ui.searching=false; ui.searchText=""; ui.expanded=false; }
  ui.tab = tab; ui.open = true;
  renderDock();
}
function closeSheet(){
  ui.open = false; ui.expanded = false; ui.searching = false; ui.searchText = "";
  renderDock();
}
function clearAllFilters(){
  state.taste.clear(); state.regions.clear(); state.grapes.clear();
  state.priceMin = null; state.priceMax = null; state.category = "Todos";
  renderLimit = 60;
  renderDock(); renderList();
}

// ---------- shortlist ----------
function toggleShortlist(id){
  if(state.shortlist.has(id)){ state.shortlist.delete(id); showToast("Quitado de la shortlist"); }
  else { state.shortlist.add(id); showToast("Añadido a la shortlist"); }
  updateAfterShortlist();
}
function updateAfterShortlist(){
  renderDock();
  renderList();
  const drawer = document.getElementById("shortlistDrawer");
  if(drawer.classList.contains("open")) renderShortlistDrawer();
}
function renderShortlistDrawer(){
  const body = document.getElementById("shortlistBody");
  const items = WINES.filter(w=>state.shortlist.has(w.id));
  if(!items.length){
    body.innerHTML = `<div class="sl-empty">Aún no has añadido vinos. Toca “+” en un vino para guardarlo aquí.</div>`;
    return;
  }
  body.innerHTML = items.map(w=>{
    const open = state.openSlRow===w.id;
    return `
    <div class="row slrow ${open?"open":""}" data-slid="${w.id}">
      <div class="row-head" data-sltoggle="${w.id}">
        <div class="row-main">
          <div class="row-title"><span class="row-name">${esc(w.nombre)}</span><span class="row-vintage">${esc(vintageLabel(w))}</span></div>
          <div class="row-meta">${esc(w.productora||"Productor sin especificar")}</div>
          <div class="tagline">${tasteTagsHtml(w)}</div>
        </div>
        <span class="row-dot" title="${esc(w.categoria)}">${dotImg(w.categoria,8)}</span>
        <div class="row-trail"><div class="row-price">${fmtPrice(w.precio)} €</div></div>
        <button class="slrow-remove" data-remove="${w.id}" aria-label="Quitar de la shortlist"><span class="ic ic-20 i-x"></span></button>
      </div>
      <div class="row-expand"><div class="expand-inner">${fichaBodyHtml(w)}</div></div>
    </div>`;
  }).join("");
  body.querySelectorAll("[data-remove]").forEach(el=>{
    el.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      state.shortlist.delete(Number(el.dataset.remove));
      updateAfterShortlist();
    });
  });
  body.querySelectorAll("[data-sltoggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = Number(el.dataset.sltoggle);
      state.openSlRow = state.openSlRow===id ? null : id;
      renderShortlistDrawer();
    });
  });
}

// ---------- toast ----------
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1400);
}

// ---------- init ----------
function init(){
  renderDock();
  renderList();

  document.getElementById("closeDrawer").addEventListener("click", ()=>{
    document.getElementById("shortlistDrawer").classList.remove("open");
  });
  document.getElementById("shortlistDrawer").addEventListener("click", (e)=>{
    if(e.target.id==="shortlistDrawer") e.target.classList.remove("open");
  });
  document.getElementById("clearShortlist").addEventListener("click", ()=>{
    state.shortlist.clear();
    updateAfterShortlist();
  });
  document.getElementById("copyShortlist").addEventListener("click", ()=>{
    const items = WINES.filter(w=>state.shortlist.has(w.id));
    const text = items.map(w=>`${w.nombre} — ${w.productora||"—"} — ${(w.etiquetasCata.join(", ")||"sin etiquetas")} — ${fmtPrice(w.precio)} €`).join("\n");
    if(navigator.clipboard && text){
      navigator.clipboard.writeText(text).then(()=>showToast("Shortlist copiada")).catch(()=>showToast("No se pudo copiar"));
    } else {
      showToast(items.length? "No se pudo copiar" : "La shortlist está vacía");
    }
  });
  if(window.ResizeObserver) new ResizeObserver(syncDockHeight).observe(document.getElementById("dock"));
  wideMq.addEventListener("change", ()=>{ closeSheet(); });
}

// ---------- boot (loads data from the live sheet via /api/wines) ----------
async function boot(){
  document.getElementById("listWrap").innerHTML = `
    <div class="empty-state">
      <p><strong>Cargando la carta…</strong></p>
      <p>Sincronizando con la hoja de datos.</p>
    </div>`;
  try{
    const res = await fetch("/api/wines", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) throw new Error("respuesta vacía");
    WINES = data;
  } catch(err){
    document.getElementById("listWrap").innerHTML = `
      <div class="empty-state">
        <p><strong>No se pudo cargar la carta.</strong></p>
        <p>Revisa la conexión y vuelve a intentarlo.</p>
        <button class="btn btn-primary" id="retryBoot">Reintentar</button>
      </div>`;
    document.getElementById("retryBoot").addEventListener("click", boot);
    return;
  }
  computeDerived();
  if(!window.__inited){ window.__inited = true; init(); } else { renderDock(); renderList(); }
}
boot();
</script>
